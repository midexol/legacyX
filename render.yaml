# Render Blueprint — deploys the LegacyX backend and a managed Postgres
# database together.
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo. Render
# reads this file, provisions both resources below, and wires DATABASE_URL
# from the database into the web service automatically.
#
# Only the backend is deployed here — the frontend runs client-side and can
# be hosted separately (or run locally) pointing VITE_API_BASE_URL at this
# service's URL. See backend/README.md for the full deployment walkthrough,
# including which envVars below need real values entered manually.

services:
  - type: web
    name: legacyx-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev is required even though NODE_ENV=production is set below
    # (see envVars) — this is a TypeScript build, so devDependencies
    # (typescript, @types/*) must install regardless of NODE_ENV, or `tsc`
    # fails with "Could not find a declaration file" for every import.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: legacyx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_API_KEY
        generateValue: true
      - key: VERIFICATION_INTERVAL_SECONDS
        value: "30"
      - key: MATCHING_INTERVAL_SECONDS
        value: "15"
      - key: MARKETPLACE_MATCH_DELAY_MS
        value: "20000"
      - key: MARKETPLACE_SETTLE_DELAY_MS
        value: "20000"
      - key: FRONTEND_ORIGIN
        sync: false # set to your deployed frontend's origin once it's hosted
      # Chain integration (contracts/ — LegacyVault) is optional; leave these
      # unset to keep every vault on the pure off-chain simulation. Fill them
      # in via the Render dashboard (never commit real keys here) only if you
      # want this deployed backend to actually sign on-chain transactions —
      # see backend/README.md's "Chain integration" section.
      - key: RPC_URL_BY_CHAIN_ID
        sync: false
      - key: OPERATOR_PRIVATE_KEY
        sync: false
      - key: TRUSTED_VERIFIER_PRIVATE_KEY
        sync: false

databases:
  - name: legacyx-db
    plan: free
    databaseName: legacyx
    user: legacyx
